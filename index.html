<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F3D2E">
<meta name="description" content="NammaTrip AI: a bilingual, budget-aware Karnataka trip planner with live weather and maps. Transparent rule-based engine.">
<title>NammaTrip AI - Plan your Karnataka journey</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header><b data-i="brand">NammaTrip AI</b><button id="lang" aria-label="Change language">ಕನ್ನಡ</button></header>
<section class="hero"><p class="eye">Kannada Digital Innovation Hackathon 2026</p><h1 data-i="tag">Your Budget. Your Journey. Your Karnataka.</h1></section>
<main id="main">
<form id="f" class="card">
<label><span data-i="start">Starting city</span><select id="s"></select></label>
<label><span data-i="days">Number of days</span><input id="d" type="number" min="1" max="14" value="4"></label>
<label><span data-i="trav">Travellers</span><input id="n" type="number" min="1" max="20" value="2"></label>
<label><span data-i="bud">Total budget (₹)</span><input id="b" type="number" min="1000" step="500" value="25000"></label>
<fieldset><legend data-i="int">Interests</legend>
<label class="chip"><input type="checkbox" name="i" value="heritage" checked><span data-i="heritage">Heritage</span></label>
<label class="chip"><input type="checkbox" name="i" value="temple"><span data-i="temple">Temples</span></label>
<label class="chip"><input type="checkbox" name="i" value="nature" checked><span data-i="nature">Nature</span></label>
<label class="chip"><input type="checkbox" name="i" value="coast"><span data-i="coast">Coast</span></label></fieldset>
<label><span data-i="pace">Travel pace</span><select id="p"><option value="r" data-i="r">Relaxed</option><option value="b" selected data-i="b">Balanced</option><option value="p" data-i="p">Packed</option></select></label>
<button class="go" type="submit" data-i="go">Plan my journey</button>
</form>
<section id="out" hidden>
<h2 data-i="trip">Your Karnataka plan</h2>
<div id="sum" class="card"></div>
<div id="days"></div>
<div id="map" role="img" aria-label="Map of your route"></div>
<div class="acts"><button id="save" data-i="save">Save</button><button id="share" data-i="share">Share link</button><button id="copy" data-i="copy">Copy text</button><button id="print" data-i="print">Print</button></div>
</section>
<section class="card"><h2 data-i="saved">Saved trips</h2><div id="list"></div></section>
<p class="note" data-i="note"></p>
</main>
<footer>NammaTrip AI · ಕನ್ನಡದಲ್ಲಿ ನಿಮ್ಮ ಕರ್ನಾಟಕ ಪ್ರವಾಸದ ಸಂಗಾತಿ · Code. Create. Celebrate Kannada.</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
